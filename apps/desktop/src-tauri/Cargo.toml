[package]
name = "pcl-desktop"
version = "0.2.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pcl-core = { path = "../../../crates/core" }
pcl-auth = { path = "../../../crates/auth" }
